app:
  name: bmo-rag
  log_level: INFO

llm:
  provider: openai
  model: gpt-5

embeddings:
  provider: vllm
  model: BAAI/bge-m3

retrieval:
  vector_store: qdrant
  top_k: 5
  chunk_size: 1000
  chunk_overlap: 150

observability:
  enabled: true
  database: data/observability/rag_observability.sqlite3

paths:
  raw_data: data/raw
  processed_data: data/processed
  indexes: data/indexes
